      // --- Search Execution, Scenario & Streaming Actions ---
      let sweepInterval = null;

      function stopSweepTimer() {
        if (sweepInterval) {
          clearInterval(sweepInterval);
          sweepInterval = null;
        }
      }

      function applyScenario(scenarioId, { preserveQuery = false } = {}) {
        stopSweepTimer();
        state.scenario = scenarioId;
        state.pendingBuffer = [];
        state.bufferLatched = false;
        state.keywordError = '';

        if (!preserveQuery) {
          state.keywords = 'Patagonia Nano Puff jacket';
          state.priceMin = '';
          state.priceMax = '';
          state.armedMarketplaces = { ebay: true, poshmark: true, mercari: true, facebook: true };
          state.queriedMarketplaces = { ebay: true, poshmark: true, mercari: true, facebook: true };
          state.visibleMarketplaces = { ebay: true, poshmark: true, mercari: true, facebook: true };
        }

        const pool = buildQueryPool(state.keywords);
        state.extraPool = pool.extra;
        state.marketplaceStates = {
          ebay: { status: 'ready', sessionReady: true, reason: '', count: 0 },
          poshmark: { status: 'ready', sessionReady: true, reason: '', count: 0 },
          mercari: { status: 'ready', sessionReady: true, reason: '', count: 0 },
          facebook: { status: 'ready', sessionReady: true, reason: '', count: 0 }
        };

        if (scenarioId === 'local_pickup') {
          state.conditions = [];
          state.fulfillment = 'local_pickup';
          state.fbSweep = { active: false, currentCityIdx: 8, totalCities: 8, stoppedByUser: false, cooldownLabel: '' };
          state.loadedListings = pool.initial;
        } else if (scenarioId === 'broadened') {
          state.conditions = ['like_new', 'good'];
          state.fulfillment = 'any';
          state.fbSweep = { active: false, currentCityIdx: 8, totalCities: 8, stoppedByUser: false, cooldownLabel: '' };
          state.loadedListings = pool.initial;
        } else if (scenarioId === 'partial_failure') {
          state.conditions = [];
          state.fulfillment = 'any';
          state.marketplaceStates.mercari = {
            status: 'challenged',
            sessionReady: false,
            reason: 'Cloudflare verification challenge on searchFacetQuery — 0 automatic retries.',
            count: 0
          };
          state.marketplaceStates.facebook = {
            status: 'checkpoint_aborted',
            sessionReady: false,
            reason: 'Login checkpoint detected on City 4 of 8 (Denver) — circuit breaker halted sweep; 3 prior cities preserved.',
            count: 3
          };
          state.fbSweep = { active: false, currentCityIdx: 3, totalCities: 8, stoppedByUser: false, cooldownLabel: '' };
          // Keep eBay, Poshmark, and first 3 Facebook cities; omit Mercari & remaining FB cities until retried
          state.loadedListings = pool.initial.filter(l => {
            if (l.marketplace === 'mercari') return false;
            if (l.marketplace === 'facebook' && !['seattle', 'sanfrancisco', 'losangeles'].includes(l.cityHub)) return false;
            return true;
          });
        } else {
          // Normal 8-city sweep (starts at City 3 of 8 sweeping in progress so user sees live progress + Stop button)
          state.conditions = [];
          state.fulfillment = 'any';
          state.loadedListings = pool.initial.filter(l => l.marketplace !== 'facebook' || ['seattle', 'sanfrancisco', 'losangeles'].includes(l.cityHub));
          state.fbSweep = { active: true, currentCityIdx: 3, totalCities: 8, stoppedByUser: false, cooldownLabel: 'Sweeping Denver next (3–5s cooldown)' };
        }
        render();
      }

      function runLiveSearch({ fromSaved = false } = {}) {
        const trimmed = state.keywords.trim();
        if (!trimmed) {
          state.keywordError = 'Enter keywords to search across Marketplaces.';
          render();
          return;
        }
        state.keywordError = '';
        stopSweepTimer();
        state.pendingBuffer = [];
        state.bufferLatched = false;
        state.queriedMarketplaces = { ...state.armedMarketplaces };
        state.visibleMarketplaces = { ...state.armedMarketplaces };

        const pool = buildQueryPool(trimmed);
        state.extraPool = pool.extra;
        for (const mp of MARKETPLACES) {
          state.marketplaceStates[mp.id].status = 'ready';
          state.marketplaceStates[mp.id].reason = '';
        }

        if (state.armedMarketplaces.facebook && state.selectedHubs.length > 0 && state.fulfillment !== 'local_pickup') {
          state.fbSweep = {
            active: true,
            currentCityIdx: 1,
            totalCities: state.selectedHubs.length,
            stoppedByUser: false,
            cooldownLabel: `City 1 of ${state.selectedHubs.length} (${getHubLabel(state.selectedHubs[0])}) · 3–5s cooldown`
          };
          const firstHub = state.selectedHubs[0];
          state.loadedListings = pool.initial.filter(l => l.marketplace !== 'facebook' || l.cityHub === firstHub);
          startSimulatedSweep();
        } else {
          state.fbSweep = { active: false, currentCityIdx: state.selectedHubs.length, totalCities: state.selectedHubs.length, stoppedByUser: false, cooldownLabel: '' };
          state.loadedListings = pool.initial;
        }

        if (!fromSaved && state.activeSavedSearchId) {
          // Keep dirty state untouched if edited, otherwise clear
        }
        render();
      }

      function startSimulatedSweep() {
        stopSweepTimer();
        sweepInterval = window.setInterval(() => {
          if (!state.fbSweep.active) {
            stopSweepTimer();
            return;
          }
          if (state.fbSweep.currentCityIdx >= state.fbSweep.totalCities) {
            state.fbSweep.active = false;
            state.fbSweep.cooldownLabel = '';
            stopSweepTimer();
            render();
            return;
          }
          streamNextBatch({ silentIfEmpty: true });
        }, 3800);
      }

      function streamNextBatch({ silentIfEmpty = false } = {}) {
        const incoming = [];
        // Advance Facebook city sweep if active
        if (state.fbSweep.active && state.fbSweep.currentCityIdx < state.fbSweep.totalCities) {
          const nextHubSlug = state.selectedHubs[state.fbSweep.currentCityIdx] || 'denver';
          state.fbSweep.currentCityIdx += 1;
          const pool = buildQueryPool(state.keywords);
          const candidateFb = [...pool.initial, ...pool.extra].filter(
            l => l.marketplace === 'facebook' &&
            l.cityHub === nextHubSlug &&
            !state.loadedListings.some(ex => listingKey(ex) === listingKey(l)) &&
            !state.pendingBuffer.some(ex => listingKey(ex) === listingKey(l))
          );
          if (candidateFb.length > 0) {
            incoming.push(...candidateFb);
          } else {
            incoming.push({
              marketplace: 'facebook',
              marketplaceListingId: `fb-hub-${nextHubSlug}-${Date.now()}`,
              cityHub: nextHubSlug,
              title: `${state.keywords.trim()} (${getHubLabel(nextHubSlug)} Hub)`,
              price: 89,
              shippingPrice: 0,
              shippingType: 'local_pickup',
              listingFormat: 'FIXED_PRICE',
              conditionTier: 'good',
              conditionLabel: 'Used - Good',
              locationLabel: getHubLabel(nextHubSlug),
              nativeRank: 2,
              hoursAgo: 0.2,
              thumb: makeSvgThumb('jacket', '#ecfeff', '#0e7490', '#22d3ee', nextHubSlug.toUpperCase()),
              url: `https://www.facebook.com/marketplace/search/?query=${encodeURIComponent(state.keywords)}`
            });
          }
          if (state.fbSweep.currentCityIdx >= state.fbSweep.totalCities) {
            state.fbSweep.active = false;
            state.fbSweep.cooldownLabel = '';
            stopSweepTimer();
          } else {
            const upcomingSlug = state.selectedHubs[state.fbSweep.currentCityIdx];
            state.fbSweep.cooldownLabel = `Next: ${getHubLabel(upcomingSlug)} (3–5s cooldown)`;
          }
        }

        // Also pull up to 2 extra non-Facebook Listings when triggered manually or if pool remains
        const extraNonFb = state.extraPool.splice(0, 2);
        incoming.push(...extraNonFb);

        if (incoming.length === 0) {
          // Synthesize 2 fresh Listings so "+ Stream Batch" always demonstrates scroll-safe merge
          const idNum = Math.floor(Math.random() * 900) + 5000;
          incoming.push(
            {
              marketplace: 'ebay',
              marketplaceListingId: `eb-${idNum}`,
              title: `${state.keywords.trim()} — Fresh Drop #${idNum}`,
              price: 99,
              shippingPrice: 0,
              shippingType: 'free',
              listingFormat: 'FIXED_PRICE',
              conditionTier: 'like_new',
              conditionLabel: 'Like New',
              locationLabel: 'Seattle, WA',
              nativeRank: 1,
              hoursAgo: 0.1,
              thumb: makeSvgThumb('jacket', '#dbeafe', '#1d4ed8', '#60a5fa', 'NEW DROP'),
              url: `https://www.ebay.com/itm/${idNum}`
            },
            {
              marketplace: 'poshmark',
              marketplaceListingId: `pm-${idNum + 1}`,
              title: `${state.keywords.trim()} — Newly Listed #${idNum + 1}`,
              price: 87,
              shippingPrice: 7.97,
              shippingType: 'known',
              listingFormat: 'FIXED_PRICE',
              conditionTier: 'good',
              conditionLabel: 'Pre-owned (Poshmark)',
              locationLabel: 'Denver, CO',
              nativeRank: 1,
              hoursAgo: 0.1,
              thumb: makeSvgThumb('jacket', '#fdf2f8', '#9d174d', '#f472b6', 'NEW DROP'),
              url: `https://poshmark.com/listing/${idNum + 1}`
            }
          );
        }

        if (incoming.length === 0 && silentIfEmpty) return;

        const tagged = incoming.map(l => ({ ...l, isNew: true }));
        if (state.bufferLatched || window.scrollY > 450 || state.pendingBuffer.length > 0) {
          state.pendingBuffer.push(...tagged);
          updateScrollPill();
        } else {
          mergeNewListings(tagged);
        }
        render();
      }

      function mergeNewListings(items) {
        for (const item of items) {
          const key = listingKey(item);
          if (!state.loadedListings.some(x => listingKey(x) === key)) {
            state.loadedListings.unshift({ ...item, isNew: true });
          }
        }
      }

      function flushPendingBuffer() {
        if (state.pendingBuffer.length === 0) return;
        const batch = state.pendingBuffer.splice(0);
        mergeNewListings(batch);
        state.bufferLatched = window.scrollY > 450;
        updateScrollPill();
        render();
      }

      function loadMoreListings() {
        const next = state.extraPool.splice(0, 4);
        if (next.length === 0) {
          showToast('All seeded Listings for this search are already loaded.');
          return;
        }
        for (const item of next) {
          if (!state.loadedListings.some(x => listingKey(x) === listingKey(item))) {
            state.loadedListings.push(item);
          }
        }
        render();
      }

      function stopFacebookSweep() {
        stopSweepTimer();
        state.fbSweep.active = false;
        state.fbSweep.stoppedByUser = true;
        state.fbSweep.cooldownLabel = '';
        render();
      }

      function querySingleMarketplace(mpId) {
        state.queriedMarketplaces[mpId] = true;
        state.visibleMarketplaces[mpId] = true;
        state.marketplaceStates[mpId].status = 'ready';
        state.marketplaceStates[mpId].reason = '';
        const pool = buildQueryPool(state.keywords);
        const recovered = [...pool.initial, ...pool.extra].filter(l => l.marketplace === mpId);
        for (const item of recovered) {
          if (!state.loadedListings.some(x => listingKey(x) === listingKey(item))) {
            state.loadedListings.push({ ...item, isNew: true });
          }
        }
        if (mpId === 'facebook') {
          state.fbSweep = { active: false, currentCityIdx: state.selectedHubs.length, totalCities: state.selectedHubs.length, stoppedByUser: false, cooldownLabel: '' };
        }
        showToast(`Merged ${getMpMeta(mpId).label} Listings.`);
        render();
      }

      function toggleWatchlist(l) {
        const idx = state.watchlistEntries.findIndex(w => w.marketplace === l.marketplace && w.marketplaceListingId === l.marketplaceListingId);
        if (idx >= 0) {
          const removed = state.watchlistEntries.splice(idx, 1)[0];
          state.lastRemovedWatchlist = removed;
          showToast(`Removed "${removed.title.slice(0, 34)}…" from Watchlist.`, {
            undoAction: () => {
              if (!state.watchlistEntries.some(w => w.marketplace === removed.marketplace && w.marketplaceListingId === removed.marketplaceListingId)) {
                state.watchlistEntries.unshift(removed);
                render();
              }
            }
          });
        } else {
          state.watchlistEntries.unshift({
            marketplace: l.marketplace,
            marketplaceListingId: l.marketplaceListingId,
            url: l.url,
            title: l.title,
            price: l.price,
            shippingPrice: l.shippingPrice,
            thumbnailUrl: l.thumb || '',
            brokenThumb: Boolean(l.brokenThumb),
            cachedThumbnailPath: l.brokenThumb ? null : `thumbnails/${l.marketplaceListingId}.webp`,
            savedAt: new Date().toISOString()
          });
          showToast('Added to Watchlist.');
        }
        render();
      }

      function removeWatchlistEntry(marketplace, marketplaceListingId) {
        const idx = state.watchlistEntries.findIndex(w => w.marketplace === marketplace && w.marketplaceListingId === marketplaceListingId);
        if (idx < 0) return;
        const removed = state.watchlistEntries.splice(idx, 1)[0];
        showToast(`Removed from Watchlist.`, {
          undoAction: () => {
            if (!state.watchlistEntries.some(w => w.marketplace === removed.marketplace && w.marketplaceListingId === removed.marketplaceListingId)) {
              state.watchlistEntries.unshift(removed);
              render();
            }
          }
        });
        render();
      }

      // --- Saved Search Lifecycle ---
      function getOrderedSavedSearches() {
        return [...state.savedSearches];
      }

      function markDirtyIfActiveSaved() {
        if (state.activeSavedSearchId) {
          state.savedSearchDirty = true;
        }
      }

      function loadAndRunSavedSearch(id) {
        const ss = state.savedSearches.find(s => s.id === id);
        if (!ss) return;
        state.activeSavedSearchId = ss.id;
        state.savedSearchDirty = false;
        state.keywords = ss.keywords;
        state.priceMin = ss.unifiedFilters.priceMin || '';
        state.priceMax = ss.unifiedFilters.priceMax || '';
        state.conditions = [...ss.unifiedFilters.conditions];
        state.fulfillment = ss.unifiedFilters.fulfillment || 'any';
        state.pickupZip = ss.unifiedFilters.pickupZip || state.settings.homeZip;
        state.pickupRadiusMiles = ss.unifiedFilters.pickupRadiusMiles || state.settings.defaultRadiusMiles;
        state.selectedHubs = [...(ss.unifiedFilters.selectedHubs || state.settings.customHubs.map(h => h.slug))];
        state.sortOrder = ss.sortOrder || 'relevance';
        for (const mp of MARKETPLACES) {
          state.armedMarketplaces[mp.id] = ss.marketplaces.includes(mp.id);
        }
        ss.lastRunAt = new Date().toISOString();
        state.view = 'search';
        runLiveSearch({ fromSaved: true });
      }

      function updateActiveSavedSearch() {
        const ss = state.savedSearches.find(s => s.id === state.activeSavedSearchId);
        if (!ss) return;
        ss.keywords = state.keywords.trim();
        ss.unifiedFilters = {
          priceMin: state.priceMin,
          priceMax: state.priceMax,
          conditions: [...state.conditions],
          fulfillment: state.fulfillment,
          pickupZip: state.pickupZip,
          pickupRadiusMiles: state.pickupRadiusMiles,
          selectedHubs: [...state.selectedHubs]
        };
        ss.marketplaces = MARKETPLACES.filter(m => state.armedMarketplaces[m.id]).map(m => m.id);
        ss.sortOrder = state.sortOrder;
        ss.lastRunAt = new Date().toISOString();
        state.savedSearchDirty = false;
        showToast(`Updated Saved Search "${ss.name}".`);
        render();
      }

      function saveAsNewSavedSearch() {
        const hasKeywords = state.keywords.trim().length > 0;
        const hasFilter = Boolean(state.priceMin || state.priceMax || state.conditions.length || state.fulfillment !== 'any');
        if (!hasKeywords && !hasFilter) {
          state.keywordError = 'Saving requires keywords or at least one Unified Filter.';
          render();
          return;
        }
        openSaveNewDialog((name) => {
          const now = new Date().toISOString();
          const newId = `ss-${Date.now()}`;
          state.savedSearches.unshift({
            id: newId,
            name,
            keywords: state.keywords.trim(),
            unifiedFilters: {
              priceMin: state.priceMin,
              priceMax: state.priceMax,
              conditions: [...state.conditions],
              fulfillment: state.fulfillment,
              pickupZip: state.pickupZip,
              pickupRadiusMiles: state.pickupRadiusMiles,
              selectedHubs: [...state.selectedHubs]
            },
            marketplaces: MARKETPLACES.filter(m => state.armedMarketplaces[m.id]).map(m => m.id),
            sortOrder: state.sortOrder,
            createdAt: now,
            lastRunAt: now
          });
          state.activeSavedSearchId = newId;
          state.savedSearchDirty = false;
          showToast(`Saved "${name}".`);
          render();
        });
      }

      function promptDeleteSavedSearch(id) {
        const ss = state.savedSearches.find(s => s.id === id);
        if (!ss) return;
        openConfirmDialog({
          title: 'Delete Saved Search?',
          body: `Remove "${ss.name}" from your Saved Searches? Listings in your Watchlist are not affected.`,
          submitLabel: 'Delete',
          onConfirm: () => {
            state.savedSearches = state.savedSearches.filter(s => s.id !== id);
            if (state.activeSavedSearchId === id) {
              state.activeSavedSearchId = null;
              state.savedSearchDirty = false;
            }
            showToast(`Deleted "${ss.name}".`);
            render();
          }
        });
      }

      function promptRenameSavedSearch(id) {
        const ss = state.savedSearches.find(s => s.id === id);
        if (!ss) return;
        openRenameDialog(ss.name, (newName) => {
          ss.name = newName;
          showToast(`Renamed Saved Search to "${newName}".`);
          render();
        });
      }

      function getHubLabel(slug) {
        const found = state.settings.customHubs.find(h => h.slug === slug);
        return found ? found.label : slug;
      }

      // --- HTML Escaping ---
      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // --- Shared HTML Fragment Builders ---
      function renderThumbHtml(item, fallbackCaption = 'Preview expired') {
        if (item.brokenThumb || !item.thumb && !item.thumbnailUrl) {
          return `
            <div class="thumb-placeholder" aria-label="${esc(fallbackCaption)}">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 16l5-5 4 4 3-3 6 6"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
              <span>${esc(fallbackCaption)}</span>
            </div>`;
        }
        const src = item.thumb || item.thumbnailUrl;
        return `<img src="${esc(src)}" alt="" loading="lazy">`;
      }

      function renderNavHtml() {
        const wcCount = state.watchlistEntries.length;
        return `
          <nav class="nav-pills" aria-label="Primary">
            <button type="button" class="nav-btn" data-nav="search" ${state.view === 'search' ? 'aria-current="page"' : ''}>Search</button>
            <button type="button" class="nav-btn" data-nav="watchlist" ${state.view === 'watchlist' ? 'aria-current="page"' : ''}>Watchlist (${wcCount})</button>
            <button type="button" class="nav-btn" data-nav="settings" ${state.view === 'settings' ? 'aria-current="page"' : ''}>Settings</button>
          </nav>`;
      }

      function renderUnifiedFiltersHtml({ compact = false, sectionPrefix = 'f' } = {}) {
        const hubs = state.settings.customHubs;
        return `
          <div style="display:flex; flex-direction:column; gap:${compact ? '10px' : '14px'};">
            <div class="filter-section">
              <span class="filter-label">Price (USD base price)</span>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                <input type="number" min="0" class="input tabular" placeholder="Min $" value="${esc(state.priceMin)}" data-filter-input="priceMin" aria-label="Minimum price">
                <input type="number" min="0" class="input tabular" placeholder="Max $" value="${esc(state.priceMax)}" data-filter-input="priceMax" aria-label="Maximum price">
              </div>
            </div>

            <div class="filter-section">
              <span class="filter-label">Condition (5-tier)</span>
              <div class="${compact ? 'chip-group' : 'check-list'}">
                ${CONDITION_TIERS.map(c => {
                  const checked = state.conditions.includes(c.id);
                  return compact
                    ? `<button type="button" class="toggle-pill" data-cond-toggle="${c.id}" aria-pressed="${checked}">${esc(c.label)}</button>`
                    : `<label class="check-row"><input type="checkbox" data-cond-check="${c.id}" ${checked ? 'checked' : ''}><span>${esc(c.label)}</span></label>`;
                }).join('')}
              </div>
            </div>

            <div class="filter-section">
              <span class="filter-label">Fulfillment</span>
              <div class="check-list">
                ${[
                  { id: 'any', label: 'Any (Shipping or Pickup)' },
                  { id: 'shipping', label: 'Shipping only' },
                  { id: 'local_pickup', label: 'Local pickup only' }
                ].map(f => `
                  <label class="check-row">
                    <input type="radio" name="${sectionPrefix}-fulfillment" value="${f.id}" data-fulfill-radio="${f.id}" ${state.fulfillment === f.id ? 'checked' : ''}>
                    <span>${esc(f.label)}</span>
                  </label>
                `).join('')}
              </div>
              ${state.fulfillment === 'local_pickup' ? `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px;">
                  <input type="text" class="input tabular" value="${esc(state.pickupZip)}" data-filter-input="pickupZip" placeholder="ZIP" aria-label="Pickup ZIP code">
                  <select class="select tabular" data-filter-select="pickupRadiusMiles" aria-label="Pickup radius">
                    ${[10, 25, 50, 100].map(r => `<option value="${r}" ${Number(state.pickupRadiusMiles) === r ? 'selected' : ''}>${r} mi</option>`).join('')}
                  </select>
                </div>
              ` : ''}
            </div>

            <div class="filter-section">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="filter-label">Facebook City Hubs (${state.selectedHubs.length}/${hubs.length})</span>
                <span style="font-size:11px; color:var(--text-soft);">${state.settings.facebookRadiusMiles} mi</span>
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:4px;">
                ${hubs.map(h => {
                  const on = state.selectedHubs.includes(h.slug);
                  return `<button type="button" class="toggle-pill" style="padding:3px 8px; font-size:11.5px;" data-hub-toggle="${esc(h.slug)}" aria-pressed="${on}">${esc(h.label.split(',')[0])}</button>`;
                }).join('')}
              </div>
            </div>
          </div>`;
      }

      function renderSavedSearchesHtml() {
        const ordered = getOrderedSavedSearches();
        const activeSs = state.savedSearches.find(s => s.id === state.activeSavedSearchId);
        return `
          <div style="display:flex; flex-direction:column; gap:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
              <span class="filter-label">Saved Searches</span>
              <button type="button" class="btn btn-xs btn-primary" data-action="save-new">+ Save Search</button>
            </div>
            ${activeSs && state.savedSearchDirty ? `
              <div style="background:var(--warn-bg); border:1px solid var(--warn-border); border-radius:var(--radius-sm); padding:8px; display:flex; flex-direction:column; gap:6px; font-size:12px;">
                <div style="font-weight:600; color:var(--warn);">Modified "${esc(activeSs.name)}" (not auto-saved)</div>
                <div style="display:flex; gap:6px; flex-wrap:wrap;">
                  <button type="button" class="btn btn-xs btn-primary" data-action="update-saved">Update Saved Search</button>
                  <button type="button" class="btn btn-xs" data-action="save-new">Save as New</button>
                </div>
              </div>
            ` : ''}
            <div class="saved-list">
              ${ordered.length === 0 ? `<div style="font-size:12px; color:var(--text-soft);">No Saved Searches yet.</div>` : ordered.map(ss => {
                const isActive = ss.id === state.activeSavedSearchId;
                return `
                  <div class="saved-item ${isActive ? 'active' : ''}">
                    <div class="saved-item-top">
                      <div class="saved-name-group">
                        <button type="button" class="saved-run-btn" data-run-saved="${ss.id}" title="Load and run Saved Search">${esc(ss.name)}</button>
                        <button type="button" class="saved-icon-btn" data-rename-saved="${ss.id}" aria-label="Rename ${esc(ss.name)}" title="Rename Saved Search">
                          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M11.5 2.5a1.4 1.4 0 0 1 2 2L7.5 10.5l-2.8.7.7-2.8 6.1-5.9Z"/>
                            <path d="M13 8.5v4A1.5 1.5 0 0 1 11.5 14h-8A1.5 1.5 0 0 1 2 12.5v-8A1.5 1.5 0 0 1 3.5 3h4"/>
                          </svg>
                        </button>
                      </div>
                      <button type="button" class="saved-icon-btn saved-icon-delete" data-delete-saved="${ss.id}" aria-label="Delete ${esc(ss.name)}" title="Delete Saved Search">
                        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                          <line x1="4" y1="4" x2="12" y2="12"/>
                          <line x1="12" y1="4" x2="4" y2="12"/>
                        </svg>
                      </button>
                    </div>
                    <div class="saved-meta-line">
                      <span>${ss.marketplaces.length} Marketplaces · ${SORT_OPTIONS.find(o => o.id === ss.sortOrder)?.label.split(' ')[0] || 'Relevance'}</span>
                      <span style="white-space:nowrap;">${formatRelativeTime(ss.lastRunAt || ss.createdAt)}</span>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }

      function renderStatusCardHtml(mp) {
        const diag = computeTranslationDiagnostics()[mp.id];
        const mState = state.marketplaceStates[mp.id];
        const counts = getCountsByMarketplace();
        const isArmed = state.armedMarketplaces[mp.id];
        const wasQueried = state.queriedMarketplaces[mp.id];
        const isFail = diag.code === 'challenged' || diag.code === 'checkpoint';
        const showUnqueriedPrompt = isArmed && !wasQueried;
        const countLabel = wasQueried && !isFail && diag.code !== 'skipped_unsupported' ? ` (${counts[mp.id]} Listings)` : '';
        const diagText = showUnqueriedPrompt ? 'Enabled after last search — not yet queried.' : diag.reason;
        const tipId = `status-tip-${mp.id}`;
        const hasActions = showUnqueriedPrompt || isFail;
        const isFbSweeping = mp.id === 'facebook' && state.fbSweep.active;

        return `
          <div class="status-card ${isFail ? 'status-failed' : ''}" data-status-card="${mp.id}" style="anchor-name: --status-card-${mp.id};">
            <div class="status-card-head">
              <div style="display:flex; align-items:center; gap:5px; min-width:0;">
                <span class="badge ${mp.badgeClass}">${esc(mp.label)}</span>
                ${isFbSweeping ? `

      function renderVariantC() {

          ${state.view === 'settings' ? `
            <main style="max-width:1180px; margin:16px auto; padding:0 18px;">

            </main>
          ` : `
            ${state.cFilterDrawerOpen ? `
              <section aria-label="Unified Filter strip" style="background:var(--surface); border-bottom:1px solid var(--border); padding:12px 18px;">
                <div style="max-width:1520px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px;">
                  ${renderUnifiedFiltersHtml({ compact: true, sectionPrefix: 'c' })}

            <div class="shell-c-body">

                    <span class="mp-switch-label">Arm:</span>
                    ${MARKETPLACES.map(mp => `

              <aside class="shell-c-dock" aria-label="Live Sweep Monitor and Docked Watchlist">
                <section class="dock-panel">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="margin:0; font-size:14px;">Live Sweep & Marketplace Health</h2>
                  </div>
                  <div style="display:flex; flex-direction:column; gap:6px;">
                    ${MARKETPLACES.map(mp => renderStatusCardHtml(mp)).join('')}
                  </div>
                </section>

                <section class="dock-panel">
                  <div class="dock-tablist" role="tablist" aria-label="Dock panels">
                    <button type="button" role="tab" id="c-tab-watchlist" class="dock-tab" aria-selected="${state.dockTab === 'watchlist'}" tabindex="${state.dockTab === 'watchlist' ? '0' : '-1'}" data-dock-tab="watchlist">
                      Docked Watchlist (${state.watchlistEntries.length})
                    </button>
                    <button type="button" role="tab" id="c-tab-saved" class="dock-tab" aria-selected="${state.dockTab === 'saved'}" tabindex="${state.dockTab === 'saved' ? '0' : '-1'}" data-dock-tab="saved">
                      Saved Searches (${state.savedSearches.length})
                    </button>

                  <div role="tabpanel" aria-labelledby="c-tab-watchlist" ${state.dockTab === 'watchlist' ? '' : 'hidden="until-found"'}>

                      ${renderWatchlistViewHtml({ compact: true })}
                    </div>
                  </div>
                  <div role="tabpanel" aria-labelledby="c-tab-saved" ${state.dockTab === 'saved' ? '' : 'hidden="until-found"'}>

                      ${renderSavedSearchesHtml()}
                    </div>
                  </div>

      // --- Render & Focus-Preservation ---
      function render() {
        const root = document.getElementById('app-root');
        if (!root) return;

        // Preserve focus across interactive re-renders
        const activeEl = document.activeElement;
        let focusMarker = null;
        if (activeEl && root.contains(activeEl)) {
          if (activeEl.hasAttribute('data-keywords-input')) focusMarker = { sel: '[data-keywords-input]', s: activeEl.selectionStart, e: activeEl.selectionEnd };
          else if (activeEl.hasAttribute('data-filter-input')) focusMarker = { sel: `[data-filter-input="${activeEl.getAttribute('data-filter-input')}"]`, s: activeEl.selectionStart, e: activeEl.selectionEnd };
          else if (activeEl.hasAttribute('data-setting-input')) focusMarker = { sel: `[data-setting-input="${activeEl.getAttribute('data-setting-input')}"]`, s: activeEl.selectionStart, e: activeEl.selectionEnd };
        }

        // Preserve any open Variant B popover id so checkbox clicks don't collapse it
        let openPopoverId = null;
        try {
          openPopoverId = [...root.querySelectorAll('[popover]:popover-open')].map(el => el.id)[0] || null;
        } catch {
          openPopoverId = null;
        }

        if (state.variant === 'B') root.innerHTML = renderVariantB();
        else if (state.variant === 'C') root.innerHTML = renderVariantC();
        else root.innerHTML = renderVariantA();

        if (openPopoverId) {
          const pop = document.getElementById(openPopoverId);
          if (pop && typeof pop.showPopover === 'function') {
            try { pop.showPopover(); } catch { /* ignore */ }
          }
        }

        if (focusMarker) {
          const target = root.querySelector(focusMarker.sel);
          if (target) {
            target.focus();
            if (typeof focusMarker.s === 'number' && typeof target.setSelectionRange === 'function') {
              try { target.setSelectionRange(focusMarker.s, focusMarker.e); } catch { /* number input */ }
            }
          }
        }

        updateProtoBarUi();
        updateScrollPill();
        wireStatusTooltips();
      }

      function updateProtoBarUi() {
        const meta = VARIANT_META[state.variant];
        document.getElementById('proto-label').textContent = `${meta.id} (${meta.name})`;
        document.getElementById('proto-scenario').value = state.scenario;
      }

      function updateScrollPill() {
        const pill = document.getElementById('scroll-merge-pill');
        const txt = document.getElementById('scroll-merge-text');
        const indicator = document.getElementById('proto-scroll-state');
        const scrolled = window.scrollY > 450;
        if (scrolled) {
          state.bufferLatched = true;
        }
        if (indicator) {
          if (!state.bufferLatched) {
            indicator.textContent = 'Top: live merge';
          } else if (scrolled) {
            indicator.textContent = 'Scrolled (>450px): buffer latched';
          } else {
            indicator.textContent = 'Top (buffer latched until pill clicked)';
          }
        }
        if (!pill || !txt) return;
        const count = state.pendingBuffer.length;
        if (count > 0 && state.view === 'search') {
          pill.hidden = false;
          txt.textContent = `+${count} new ${count === 1 ? 'Listing' : 'Listings'} — Click to merge`;
        } else {
          pill.hidden = true;
        }
      }

      // --- Variant Switcher & URL Sync ---
      function setVariant(nextId) {
        if (!VARIANT_META[nextId]) return;
        state.variant = nextId;
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('variant', nextId);
          window.history.replaceState({}, '', url);
        } catch {
          // Safe fallback on restricted file:// schemes
        }
        render();
      }

      function cycleVariant(delta) {
        const order = ['A', 'B', 'C'];
        const idx = order.indexOf(state.variant);
        const next = order[(idx + delta + order.length) % order.length];
        setVariant(next);
      }

      function readInitialVariantFromUrl() {
        try {
          const param = new URLSearchParams(window.location.search).get('variant');
          const upper = param ? param.toUpperCase() : 'A';
          return VARIANT_META[upper] ? upper : 'A';
        } catch {
          return 'A';
        }
      }

      // --- Delegated Event Handling ---
      function attachEvents() {
        const root = document.getElementById('app-root');

        root.addEventListener('submit', (e) => {
          if (e.target.matches('[data-search-form]')) {
            e.preventDefault();
            runLiveSearch();
          }
        });

        root.addEventListener('input', (e) => {
          const t = e.target;
          if (t.matches('[data-keywords-input]')) {
            state.keywords = t.value;
            if (state.keywordError && t.value.trim()) state.keywordError = '';
            markDirtyIfActiveSaved();
          } else if (t.matches('[data-filter-input]')) {
            const field = t.getAttribute('data-filter-input');
            state[field] = t.value;
            markDirtyIfActiveSaved();
            render();
          } else if (t.matches('[data-setting-input]')) {
            const field = t.getAttribute('data-setting-input');
            state.settings[field] = field === 'facebookRadiusMiles' ? Number(t.value || 500) : t.value;
          }
        });

        root.addEventListener('change', (e) => {
          const t = e.target;
          if (t.matches('[data-cond-check]')) {
            const id = t.getAttribute('data-cond-check');
            if (t.checked && !state.conditions.includes(id)) state.conditions.push(id);
            else if (!t.checked) state.conditions = state.conditions.filter(c => c !== id);
            markDirtyIfActiveSaved();
            render();
          } else if (t.matches('[data-fulfill-radio]')) {
            state.fulfillment = t.value;
            markDirtyIfActiveSaved();
            render();
          } else if (t.matches('[data-filter-select]')) {
            const field = t.getAttribute('data-filter-select');
            state[field] = Number(t.value);
            markDirtyIfActiveSaved();
            render();
          } else if (t.matches('[data-sort-select]')) {
            state.sortOrder = t.value;
            markDirtyIfActiveSaved();
            render();
          } else if (t.matches('[data-toggle-shipping-sort]')) {
            state.includeKnownShipping = t.checked;
            render();
          } else if (t.matches('[data-wc-filter-mp]')) {
            state.watchlistFilterMp = t.value;
            render();
          } else if (t.matches('[data-wc-sort]')) {
            state.watchlistSort = t.value;
            render();
          } else if (t.matches('[data-c-saved-select]')) {
            if (t.value) loadAndRunSavedSearch(t.value);
          } else if (t.matches('[data-setting-select]')) {
            const field = t.getAttribute('data-setting-select');
            state.settings[field] = field === 'defaultRadiusMiles' ? Number(t.value) : t.value;
            showToast(`Updated setting: ${field}.`);
          }
        });

        root.addEventListener('click', (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;

          if (btn.hasAttribute('data-nav')) {
            state.view = btn.getAttribute('data-nav');
            render();
          } else if (btn.hasAttribute('data-arm-mp')) {
            const mpId = btn.getAttribute('data-arm-mp');
            state.armedMarketplaces[mpId] = !state.armedMarketplaces[mpId];
            markDirtyIfActiveSaved();
            render();
          } else if (btn.hasAttribute('data-vis-mp')) {
            const mpId = btn.getAttribute('data-vis-mp');
            state.visibleMarketplaces[mpId] = !state.visibleMarketplaces[mpId];
            render();
          } else if (btn.hasAttribute('data-cond-toggle')) {
            const id = btn.getAttribute('data-cond-toggle');
            if (state.conditions.includes(id)) state.conditions = state.conditions.filter(c => c !== id);
            else state.conditions.push(id);
            markDirtyIfActiveSaved();
            render();
          } else if (btn.hasAttribute('data-hub-toggle')) {
            const slug = btn.getAttribute('data-hub-toggle');
            if (state.selectedHubs.includes(slug)) {
              if (state.selectedHubs.length > 1) state.selectedHubs = state.selectedHubs.filter(s => s !== slug);
            } else {
              state.selectedHubs.push(slug);
            }
            markDirtyIfActiveSaved();
            render();
          } else if (btn.hasAttribute('data-watch-toggle')) {
            const key = btn.getAttribute('data-watch-toggle');
            const found = state.loadedListings.find(l => listingKey(l) === key);
            if (found) toggleWatchlist(found);
          } else if (btn.hasAttribute('data-wc-remove')) {
            const [mp, id] = btn.getAttribute('data-wc-remove').split('|');
            removeWatchlistEntry(mp, id);
          } else if (btn.hasAttribute('data-run-saved')) {
            loadAndRunSavedSearch(btn.getAttribute('data-run-saved'));
          } else if (btn.hasAttribute('data-rename-saved')) {
            promptRenameSavedSearch(btn.getAttribute('data-rename-saved'));
          } else if (btn.hasAttribute('data-delete-saved')) {
            promptDeleteSavedSearch(btn.getAttribute('data-delete-saved'));
          } else if (btn.hasAttribute('data-query-mp')) {
            querySingleMarketplace(btn.getAttribute('data-query-mp'));
          } else if (btn.hasAttribute('data-open-session')) {
            const mpId = btn.getAttribute('data-open-session');
            state.marketplaceStates[mpId].sessionReady = true;
            if (state.settings.sessions[mpId]) state.settings.sessions[mpId].status = 'Foreground window opened · Ready';
            showToast(`Opened dedicated Chrome profile for ${getMpMeta(mpId).label}. Ready to retry.`);
            render();
          } else if (btn.hasAttribute('data-retry-mp')) {
            querySingleMarketplace(btn.getAttribute('data-retry-mp'));
          } else if (btn.hasAttribute('data-reset-profile')) {
            const mpId = btn.getAttribute('data-reset-profile');
            openConfirmDialog({
              title: `Reset ${getMpMeta(mpId).label} profile?`,
              body: 'This clears cookies and local storage inside the dedicated Chrome profile directory for this Marketplace.',
              submitLabel: 'Reset profile',
              onConfirm: () => {
                if (state.settings.sessions[mpId]) state.settings.sessions[mpId].status = 'Clean profile reset';
                showToast(`Reset ${getMpMeta(mpId).label} browser profile.`);
                render();
              }
            });
          } else if (btn.hasAttribute('data-dock-tab')) {
            state.dockTab = btn.getAttribute('data-dock-tab');
            render();
          } else if (btn.hasAttribute('data-action')) {
            const act = btn.getAttribute('data-action');
            if (act === 'clear-filters') {
              state.priceMin = '';
              state.priceMax = '';
              state.conditions = [];
              state.fulfillment = 'any';
              state.selectedHubs = state.settings.customHubs.map(h => h.slug);
              markDirtyIfActiveSaved();
              render();
            } else if (act === 'stop-fb-sweep') {
              stopFacebookSweep();
            } else if (act === 'load-more') {
              loadMoreListings();
            } else if (act === 'update-saved') {
              updateActiveSavedSearch();
            } else if (act === 'save-new') {
              saveAsNewSavedSearch();
            } else if (act === 'toggle-b-diag') {
              state.bDiagnosticsOpen = !state.bDiagnosticsOpen;
              render();
            } else if (act === 'toggle-c-filters') {
              state.cFilterDrawerOpen = !state.cFilterDrawerOpen;
              render();
            } else if (act === 'toggle-replace-secret') {
              state.settings.showReplaceSecret = !state.settings.showReplaceSecret;
              render();
            } else if (act === 'save-ebay-secret') {
              if (state.settings.ebaySecretInput.trim()) {
                state.settings.hasEbaySecret = true;
                state.settings.ebaySecretInput = '';
                state.settings.showReplaceSecret = false;
                showToast('Updated eBay client_secret in secrets.json.');
                render();
              }
            } else if (act === 'verify-ebay') {
              state.settings.ebayVerifyNote = 'OAuth client_credentials token verified (5,000 calls/day quota)';
              showToast('Verified eBay Production Browse API credentials.');
              render();
            } else if (act === 'add-hub') {
              const raw = state.settings.newHubInput.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
              if (raw && !state.settings.customHubs.some(h => h.slug === raw)) {
                const label = raw.charAt(0).toUpperCase() + raw.slice(1);
                state.settings.customHubs.push({ slug: raw, label });
                state.selectedHubs.push(raw);
                state.settings.newHubInput = '';
                showToast(`Added Facebook City Hub "${label}".`);
                render();
              }
            } else if (act === 'reset-hubs') {
              state.settings.customHubs = [...DEFAULT_HUBS];
              state.selectedHubs = DEFAULT_HUBS.map(h => h.slug);
              state.settings.facebookRadiusMiles = 500;
              showToast('Restored default 8-city 500-mile preset.');
              render();
            } else if (act === 'stop-server') {
              state.settings.serverStatus = 'Stopped cleanly (close tab)';
              showToast('Local Hono server and browser profiles shut down cleanly.');
              render();
            }
          }
        });

        // Keyboard arrow navigation inside Variant C dock tablist
        root.addEventListener('keydown', (e) => {
          if (e.target.matches('[role="tab"]') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
            e.preventDefault();
            state.dockTab = state.dockTab === 'watchlist' ? 'saved' : 'watchlist';
            render();
            const nextTab = document.getElementById(state.dockTab === 'watchlist' ? 'c-tab-watchlist' : 'c-tab-saved');
            if (nextTab) nextTab.focus();
          }
        });

        // Sync tab panels revealed by browser Find-in-page (`hidden="until-found"` -> `beforematch`)
        root.addEventListener('beforematch', (e) => {
          const panel = e.target.closest('[role="tabpanel"]');
          if (!panel) return;
          const labelled = panel.getAttribute('aria-labelledby');
          if (labelled === 'c-tab-watchlist') state.dockTab = 'watchlist';
          if (labelled === 'c-tab-saved') state.dockTab = 'saved';
          render();
        });

        // Floating merge pill
        document.getElementById('scroll-merge-pill').addEventListener('click', flushPendingBuffer);

        // Floating bottom prototype bar controls
        document.getElementById('proto-prev').addEventListener('click', () => cycleVariant(-1));
        document.getElementById('proto-next').addEventListener('click', () => cycleVariant(1));
        document.getElementById('proto-scenario').addEventListener('change', (e) => {
          applyScenario(e.target.value);
        });
        document.getElementById('proto-stream-btn').addEventListener('click', () => streamNextBatch());

        // Keyboard variant switching (← / →), guarded against form fields and open modal dialogs
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            document.querySelectorAll('.status-tooltip.tooltip-open').forEach(el => el.classList.remove('tooltip-open'));
            return;
          }
          if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
          if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
          if (document.querySelector('dialog[open]')) return;
          const active = document.activeElement;
          if (active && (active.matches('input, textarea, select, [contenteditable], [role="tab"]') || active.closest('[contenteditable]'))) {
            return;
          }
          e.preventDefault();
          cycleVariant(e.key === 'ArrowRight' ? 1 : -1);
        });

        window.addEventListener('scroll', updateScrollPill, { passive: true });
      }

      // --- Boot ---
      state.variant = readInitialVariantFromUrl();
      setupDialogs();
      setupToastLifecycle();
      setupHintTooltips();
      attachEvents();
      applyScenario('normal');
    })();
  </script>
</body>
</html>
