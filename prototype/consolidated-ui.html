<!-- PROTOTYPE (THROWAWAY): Three structurally distinct UI variants (A: Workbench Sidebar, B: Full-Width Command Bar, C: Split Triage + Watchlist Dock) for Unified Marketplace Search v1, switchable via ?variant=A|B|C and the bottom bar. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Marketplace Search — UI Prototype</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --surface-subtle: #eef2f6;
      --border: #dfe4ec;
      --border-strong: #c4cdd9;
      --text: #0f172a;
      --text-muted: #475569;
      --text-soft: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --skip-bg: #f1f5f9;
      --skip-text: #475569;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.09);
      --shadow-lg: 0 14px 36px rgba(15, 23, 42, 0.16);
      --ebay-bg: #eff6ff;
      --ebay-fg: #1d4ed8;
      --poshmark-bg: #fdf2f8;
      --poshmark-fg: #9d174d;
      --mercari-bg: #eef2ff;
      --mercari-fg: #4338ca;
      --facebook-bg: #ecfeff;
      --facebook-fg: #0e7490;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
    }

    body {
      margin: 0;
      padding-bottom: 84px; /* space for floating bottom prototype switcher */
      min-height: 100vh;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Shared UI primitives */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      font-size: 13px;
      line-height: 1.2;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-muted);
      border-color: #94a3b8;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    .btn-danger:hover:not(:disabled) {
      background: #991b1b;
      border-color: #991b1b;
    }

    .btn-ghost {
      border-color: transparent;
      background: transparent;
      color: var(--text-muted);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .btn-sm {
      padding: 4px 9px;
      font-size: 12px;
    }

    .btn-xs {
      padding: 3px 7px;
      font-size: 11px;
    }

    .input, .select {
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      font-size: 13px;
      min-width: 0;
    }

    .input:focus, .select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
    }

    .mp-ebay { background: var(--ebay-bg); color: var(--ebay-fg); }
    .mp-poshmark { background: var(--poshmark-bg); color: var(--poshmark-fg); }
    .mp-mercari { background: var(--mercari-bg); color: var(--mercari-fg); }
    .mp-facebook { background: var(--facebook-bg); color: var(--facebook-fg); }

    .diag-exact { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
    .diag-broadened { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
    .diag-skipped { background: var(--skip-bg); color: var(--skip-text); border: 1px solid var(--border); }
    .diag-error { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
    .diag-streaming { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

    .new-badge {
      background: #fbbf24;
      color: #451a03;
      border: 1px solid #d97706;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }

    .nav-pills {
      display: flex;
      gap: 4px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
    }

    .nav-btn:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .nav-btn[aria-current="page"] {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: #bfdbfe;
    }

    .validation-msg {
      color: var(--danger);
      font-size: 12px;
      font-weight: 500;
      margin-top: 4px;
    }

    /* Thumbnails & broken placeholder */
    .thumb-wrap {
      position: relative;
      background: var(--surface-subtle);
      overflow: hidden;
      flex-shrink: 0;
    }

    .thumb-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px;
      text-align: center;
      color: var(--text-soft);
      background: repeating-linear-gradient(
        -45deg,
        #f8fafc,
        #f8fafc 8px,
        #f1f5f9 8px,
        #f1f5f9 16px
      );
      border: 1px dashed var(--border-strong);
      font-size: 11px;
    }

    /* Listing Card (used in A & B) */
    .listing-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .listing-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }

    .listing-card .thumb-wrap {
      aspect-ratio: 4 / 3;
      width: 100%;
    }

    .card-top-overlay {
      position: absolute;
      inset: 8px 8px auto 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      pointer-events: none;
    }

    .card-top-overlay > * {
      pointer-events: auto;
    }

    .watch-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.14);
      background: rgba(255, 255, 255, 0.94);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    .watch-toggle[aria-pressed="true"] {
      background: #fef2f2;
      border-color: #fecaca;
      color: #be123c;
    }

    .card-body {
      padding: 11px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
    }

    .card-title {
      margin: 0;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-price-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }

    .price-main {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .ship-badge {
      font-size: 11.5px;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .ship-badge.ship-free {
      background: var(--success-bg);
      color: var(--success);
    }

    .auction-meta {
      font-size: 11.5px;
      color: #9a3412;
      background: #ffedd5;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      align-self: flex-start;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-soft);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin-top: auto;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--surface-subtle);
      font-size: 12px;
    }

    /* Filter control helpers */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-soft);
    }

    .check-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      cursor: pointer;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .toggle-pill[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Marketplace toggle bar differentiation */
    .mp-switch-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .mp-switch-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-soft);
      margin-right: 2px;
    }

    .mp-arm-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .mp-arm-btn[aria-pressed="true"] {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    /* Status cards */
    .status-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .status-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .status-card.status-failed {
      border-color: var(--danger-border);
      background: #fffafa;
    }

    .status-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .status-card-badges {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-count {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .fb-sweep-stop-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid #a5f3fc;
      background: #ecfeff;
      color: #0e7490;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .fb-sweep-stop-btn .fb-stop-icon {
      display: none;
    }

    .fb-sweep-stop-btn:hover,
    .fb-sweep-stop-btn:focus-visible {
      border-color: var(--danger-border);
      background: var(--danger-bg);
      color: var(--danger);
    }

    .fb-sweep-stop-btn:hover .fb-spinner-icon,
    .fb-sweep-stop-btn:focus-visible .fb-spinner-icon {
      display: none;
    }

    .fb-sweep-stop-btn:hover .fb-stop-icon,
    .fb-sweep-stop-btn:focus-visible .fb-stop-icon {
      display: block;
    }

    .fb-spinner-icon {
      animation: fb-spin 0.9s linear infinite;
    }

    @keyframes fb-spin {
      to { transform: rotate(360deg); }
    }

    .status-info-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface-muted);
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-info-btn:hover,
    .status-info-btn:focus-visible {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    [interestfor] {
      --interest-delay-start: 0.15s;
      interest-delay-start: var(--interest-delay-start);
      --interest-delay-end: 0.1s;
      interest-delay-end: var(--interest-delay-end);
    }

    .status-strip:has([interestfor]:is(:interest-source, .interest-source)) [interestfor] {
      --interest-delay-start: 0s;
    }

    [popover].status-tooltip {
      border: 1px solid #334155;
      border-radius: var(--radius-sm);
      background: #0f172a;
      color: #f8fafc;
      padding: 8px 10px;
      max-width: calc(100vw - 16px);
      font-size: 12px;
      line-height: 1.4;
      box-shadow: var(--shadow-lg);
      z-index: 900;
    }

    [popover].status-tooltip:is(:popover-open, .\:popover-open, .tooltip-open) {
      display: block;
    }

    @supports (position-area: block-end) {
      [popover].status-tooltip {
        inset: auto;
        margin: 6px 0;
        position-area: block-end;
        position-try-fallbacks: flip-block, flip-inline, flip-block flip-inline;
      }
      @supports (width: anchor-size(width)) {
        [popover].status-tooltip {
          width: anchor-size(width);
          max-width: min(anchor-size(width), calc(100vw - 16px));
        }
      }
    }

    @supports not (position-area: block-end) {
      [popover].status-tooltip {
        position: fixed;
        margin: 0;
      }
    }

    .status-diag {
      color: #f8fafc;
      line-height: 1.4;
    }

    .status-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    /* Variant A: Workbench Sidebar */
    .shell-a {
      display: grid;
      grid-template-columns: 296px minmax(0, 1fr);
      min-height: calc(100vh - 84px);
    }

    .shell-a-sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .shell-a-main {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--accent);
      display: inline-block;
    }

    .saved-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 368px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .saved-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 9px;
      background: var(--surface-muted);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .saved-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .saved-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }

    .saved-name-group {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .saved-run-btn {
      text-align: left;
      background: transparent;
      border: 0;
      padding: 0;
      font-weight: 600;
      font-size: 12.5px;
      color: var(--text);
      min-width: 0;
    }

    .saved-run-btn:hover {
      color: var(--accent);
    }

    .saved-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 4px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-soft);
    }

    .saved-icon-btn:hover,
    .saved-icon-btn:focus-visible {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .saved-icon-delete:hover,
    .saved-icon-delete:focus-visible {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .saved-meta-line {
      font-size: 11px;
      color: var(--text-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .grid-a {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 14px;
    }

    /* Variant B: Full-Width Command Bar */
    .shell-b-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .shell-b-row {
      max-width: 1520px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .shell-b-row + .shell-b-row {
      border-top: 1px solid var(--surface-subtle);
      padding-top: 8px;
      padding-bottom: 8px;
      background: var(--surface-muted);
    }

    .shell-b-main {
      max-width: 1520px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .grid-b {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 12px;
    }

    /* Variant B Anchored Popovers (modern-web-guidance: viewport-aware-dropdowns) */
    [popover].anchored-overlay {
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      padding: 14px;
      box-shadow: var(--shadow-lg);
      min-width: 280px;
      max-width: min(380px, 92vw);
      max-height: 75vh;
      overflow-y: auto;
    }

    @supports (position-area: block-end) {
      [popover].anchored-overlay {
        inset: auto;
        margin: 6px 0 0 0;
        position-area: block-end span-inline-end;
        position-try-fallbacks: flip-block, flip-inline, flip-block flip-inline;
      }
    }

    @supports not (position-area: block-end) {
      [popover].anchored-overlay {
        position: fixed;
        inset: auto 0 72px 0;
        width: auto;
        margin: 0 auto;
      }
    }

    /* Variant C: Split Triage + Watchlist Dock */
    .shell-c-topbar {
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .shell-c-topbar .input, .shell-c-topbar .select {
      background: #1e293b;
      border-color: #334155;
      color: #f8fafc;
    }

    .shell-c-topbar .btn-dark {

      gap: 16px;
      align-items: start;
    }

    .triage-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .triage-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .triage-row:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    .triage-row .thumb-wrap {
      width: 88px;
      height: 88px;
      border-radius: var(--radius-sm);
    }

    .triage-mid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .triage-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .triage-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 160px;
    }

    .shell-c-dock {
      position: sticky;
      top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 105px);
      overflow-y: auto;
    }

    .dock-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    /* Accessible Tablist inside Variant C dock (modern-web-guidance: tabs) */
    .dock-tablist {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .dock-tab {
      position: relative;
      flex: none;
      padding: 8px 12px;
      border: 0;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .dock-tab[aria-selected="true"] {
      color: var(--accent);
    }

    .dock-tab[aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      border-block-end: 3px solid var(--accent);
    }

    .dock-tabpanel-inner {
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Shared Watchlist & Settings surfaces */
    .panel-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .watchlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 12px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
    }

    .toolbar-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    /* Scroll-safe floating merge pill */
    .merge-pill {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 850;
      background: #1d4ed8;
      color: #ffffff;
      border: 2px solid #93c5fd;
      border-radius: 999px;
      padding: 9px 18px;
      font-weight: 700;
      font-size: 13px;

      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .merge-pill:hover {
      background: #1e40af;
    }

    .merge-pill[hidden] {
      display: none;
    }

    /* Floating bottom prototype switcher */
    .proto-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 950;
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid #3f3f46;

      align-items: center;

      height: 28px;

      border: 1px solid #3f3f46;
      background: #27272a;
      color: #f4f4f5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;

    .proto-arrow:hover {
      background: #3f3f46;
    }

    .proto-label {
      font-size: 12.5px;
      font-weight: 700;
      padding: 0 4px;
      color: #ffffff;
    }

    .proto-sep {
      width: 1px;
      height: 20px;
      background: #3f3f46;
      flex-shrink: 0;
    }

    .proto-select {
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .proto-btn {
      background: #2563eb;
      color: #ffffff;
      border: 0;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;

    .proto-btn:hover {
      background: #1d4ed8;
    }

    .proto-scroll-state {
      font-size: 11px;
      color: #a1a1aa;
      padding: 0 4px;
    }

    /* Native Modal <dialog> styling (modern-web-guidance: dialog) */
    dialog {
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 0;
      max-width: min(440px, 92vw);
      width: 100%;
      box-shadow: var(--shadow-lg);
      background: var(--surface);
      color: var(--text);
    }

    dialog[open] {
      display: block;
    }

    dialog:modal {

    }

    dialog::backdrop {

      backdrop-filter: blur(2px);
      overflow: hidden;

    .dialog-inner {

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dialog-title {

      font-size: 16px;

    }

    .dialog-actions {

      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;

    .toast-stack {

      right: 16px;

      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast-item {

      inset: 16px 16px auto auto;

      border-radius: var(--radius-md);
      background: #0f172a;
      color: #f8fafc;

        align-items: center;

<body>
  <div id="app-root"></div>

  <!-- Scroll-safe floating merge pill -->
  <button id="scroll-merge-pill" type="button" class="merge-pill" hidden>
    <span id="scroll-merge-text">+0 new Listings — Click to merge</span>

  <div role="region" aria-label="Notifications" class="toast-stack">

      <span id="undo-toast-msg" style="font-size: 13px; flex: 1;"></span>
      <button id="undo-toast-action" type="button" class="btn btn-sm btn-primary" hidden>Undo</button>
      <button id="undo-toast-close" type="button" class="btn btn-sm btn-ghost" style="color:#cbd5e1;" popovertarget="undo-toast" popovertargetaction="hide" aria-label="Close notification">Close</button>
    </div>
  </div>

  <!-- Native modal dialogs -->
  <dialog id="confirm-dialog" aria-labelledby="confirm-dialog-title">
    <form method="dialog" class="dialog-inner">
      <h2 id="confirm-dialog-title" class="dialog-title">Confirm action</h2>
      <p id="confirm-dialog-body" style="margin:0; color: var(--text-muted); font-size: 13.5px;"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn" autofocus>Cancel</button>
        <button type="submit" value="confirm" id="confirm-dialog-submit" class="btn btn-danger">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="rename-dialog" closedby="any" aria-labelledby="rename-dialog-title">
    <form method="dialog" class="dialog-inner">
      <h2 id="rename-dialog-title" class="dialog-title">Rename Saved Search</h2>
      <label for="rename-dialog-input" style="font-size: 12.5px; font-weight: 600;">Saved Search name</label>
      <input id="rename-dialog-input" type="text" class="input" required maxlength="80">

        <button type="submit" value="cancel" class="btn">Cancel</button>
        <button type="submit" value="confirm" class="btn btn-primary">Save name</button>
      </div>
    </form>
  </dialog>

        <button type="submit" value="cancel" class="btn">Cancel</button>

          if (mState.status === 'checkpoint_aborted') {
            out[mp.id] = { code: 'checkpoint', label: 'Circuit breaker', badgeClass: 'diag-error', reason: mState.reason || 'Login checkpoint detected — halted sweep cleanly.' };
            continue;
          }
          if (isLocalPickup && (mp.id === 'poshmark' || mp.id === 'mercari')) {
            out[mp.id] = { code: 'skipped_unsupported', label: 'Skipped (unsupported)', badgeClass: 'diag-skipped', reason: `No local pickup filter on ${mp.label} — skipped.` };
            continue;
          }
          if (hasFineCondition && mp.id === 'ebay') {
            out[mp.id] = { code: 'broadened', label: 'Broadened', badgeClass: 'diag-broadened', reason: 'Includes category-general Used (3000) so Apparel/Home Listings are not dropped.' };
            continue;
          }
          if (hasFineCondition && mp.id === 'poshmark') {
            out[mp.id] = { code: 'broadened', label: 'Broadened', badgeClass: 'diag-broadened', reason: 'Queries all pre-owned Listings; fine condition tiers unsupported.' };
            continue;
          }
          if (hasFineCondition && mp.id === 'facebook') {
            out[mp.id] = { code: 'broadened', label: 'Broadened', badgeClass: 'diag-broadened', reason: 'Mapped to Facebook’s 4-tier condition filter.' };
            continue;
          }
          if (isShippingOnly && mp.id === 'facebook') {
            out[mp.id] = { code: 'broadened', label: 'Broadened', badgeClass: 'diag-broadened', reason: 'Queries nationwide 500-mi hubs; shipping arranged with seller.' };
            continue;
          }
          if (mp.id === 'facebook' && state.fbSweep.active) {
            out[mp.id] = { code: 'streaming', label: `City ${state.fbSweep.currentCityIdx} of ${state.fbSweep.totalCities}`, badgeClass: 'diag-streaming', reason: state.fbSweep.cooldownLabel || 'Sequential 1-tab sweep with 3–5s cooldown.' };
            continue;
          }
          if (mp.id === 'facebook' && state.fbSweep.stoppedByUser) {
            out[mp.id] = { code: 'stopped', label: `Stopped (${state.fbSweep.currentCityIdx}/${state.fbSweep.totalCities} cities)`, badgeClass: 'diag-broadened', reason: 'Sweep stopped early by user; loaded Listings preserved.' };
            continue;
          }
          if (hasAnyCondition && mp.id === 'mercari') {
            out[mp.id] = { code: 'exact', label: 'Exact', badgeClass: 'diag-exact', reason: '5-tier Condition maps directly to Mercari Marketplace Filters.' };
            continue;
          }
          out[mp.id] = { code: 'exact', label: 'Exact', badgeClass: 'diag-exact', reason: 'All Unified Filters mapped without broadening.' };
        }
        return out;
      }

      function getFilteredAndSortedListings() {
        const diag = computeTranslationDiagnostics();
        const pMin = state.priceMin !== '' ? Number(state.priceMin) : null;
        const pMax = state.priceMax !== '' ? Number(state.priceMax) : null;
        const condSet = new Set(state.conditions);

        const filtered = state.loadedListings.filter(l => {
          if (!state.visibleMarketplaces[l.marketplace]) return false;
          if (!state.queriedMarketplaces[l.marketplace]) return false;
          if (diag[l.marketplace].code === 'skipped_unsupported') return false;
          if (pMin !== null && !Number.isNaN(pMin) && l.price < pMin) return false;
          if (pMax !== null && !Number.isNaN(pMax) && l.price > pMax) return false;
          if (state.fulfillment === 'local_pickup' && l.shippingType !== 'local_pickup') return false;
          if (state.fulfillment === 'shipping' && l.shippingType === 'local_pickup') return false;
          if (l.marketplace === 'facebook' && l.cityHub && !state.selectedHubs.includes(l.cityHub)) return false;
          if (condSet.size > 0 && !condSet.has(l.conditionTier)) {
            // For broadened adapters, still honor user's visible filter when strict unless broadened scenario explicitly shows superset note
            return false;
          }
          return true;
        });

        if (state.sortOrder === 'price_asc' || state.sortOrder === 'price_desc') {
          const dir = state.sortOrder === 'price_asc' ? 1 : -1;
          return [...filtered].sort((a, b) => {
            const totalA = state.includeKnownShipping ? a.price + (a.shippingPrice ?? 0) : a.price;
            const totalB = state.includeKnownShipping ? b.price + (b.shippingPrice ?? 0) : b.price;
            if (totalA !== totalB) return (totalA - totalB) * dir;
            const shipA = a.shippingPrice ?? Number.MAX_SAFE_INTEGER;
            const shipB = b.shippingPrice ?? Number.MAX_SAFE_INTEGER;
            return (shipA - shipB) * dir;
          });
        }

        // Round-robin interleaving across Marketplaces (and across Facebook City Hubs)
        const byMp = { ebay: [], poshmark: [], mercari: [], facebook: [] };
        for (const item of filtered) {
          byMp[item.marketplace].push(item);
        }
        const rankCmp = (a, b) => state.sortOrder === 'newest' ? a.hoursAgo - b.hoursAgo : a.nativeRank - b.nativeRank;
        for (const mpId of Object.keys(byMp)) {
          if (mpId === 'facebook') {
            // Interleave Facebook listings across hubs before Marketplace interleaving
            const byHub = new Map();
            for (const fb of byMp.facebook.sort(rankCmp)) {
              const h = fb.cityHub || 'other';
              if (!byHub.has(h)) byHub.set(h, []);
              byHub.get(h).push(fb);
            }
            const hubQueues = [...byHub.values()];
            const interleavedFb = [];
            let moved = true;
            while (moved) {
              moved = false;
              for (const q of hubQueues) {
                if (q.length) {
                  interleavedFb.push(q.shift());
                  moved = true;
                }
              }
            }
            byMp.facebook = interleavedFb;
          } else {
            byMp[mpId].sort(rankCmp);
          }
        }

        const queues = MARKETPLACES.map(m => byMp[m.id]).filter(q => q.length > 0);
        const merged = [];
        let more = true;
        while (more) {
          more = false;
          for (const q of queues) {
            if (q.length) {
              merged.push(q.shift());
              more = true;
            }
          }
        }
        return merged;
      }

      function getCountsByMarketplace() {
        const counts = { ebay: 0, poshmark: 0, mercari: 0, facebook: 0 };
        const diag = computeTranslationDiagnostics();
        for (const l of state.loadedListings) {
          if (state.queriedMarketplaces[l.marketplace] && diag[l.marketplace].code !== 'skipped_unsupported') {
            counts[l.marketplace]++;
          }
        }
        return counts;
      }

      function getFilteredWatchlist() {
        let items = state.watchlistEntries.filter(w => state.watchlistFilterMp === 'all' || w.marketplace === state.watchlistFilterMp);
        if (state.watchlistSort === 'saved_desc') {
          items = [...items].sort((a, b) => b.savedAt.localeCompare(a.savedAt));
        } else if (state.watchlistSort === 'price_asc' || state.watchlistSort === 'price_desc') {
          const dir = state.watchlistSort === 'price_asc' ? 1 : -1;
          items = [...items].sort((a, b) => {
            if (a.price === null && b.price === null) return 0;
            if (a.price === null) return 1; // null prices always pushed to bottom
            if (b.price === null) return -1;
            return (a.price - b.price) * dir;
          });
        }
        return items;
      }

      function suggestSavedSearchName() {
        const base = state.keywords.trim() || 'Filtered Search';
        const tags = [];
        if (state.priceMax) tags.push(`Under $${state.priceMax}`);
        if (state.fulfillment === 'local_pickup') tags.push(`Local ${state.pickupZip}`);
        if (state.conditions.length === 1) {
          const c = CONDITION_TIERS.find(t => t.id === state.conditions[0]);
          if (c) tags.push(c.label);
        }
        return tags.length ? `${base} (${tags.join(', ')})` : base;
      }

      function buildNativeSearchUrl(mpId) {
        const q = encodeURIComponent(state.keywords.trim() || 'Patagonia Nano Puff');
        if (mpId === 'ebay') return `https://www.ebay.com/sch/i.html?_nkw=${q}`;
        if (mpId === 'poshmark') return `https://poshmark.com/search?query=${q}`;
        if (mpId === 'mercari') return `https://www.mercari.com/search/?keyword=${q}`;
        return `https://www.facebook.com/marketplace/search/?query=${q}`;
      }

      function formatPrice(val) {
        if (val === null || val === undefined || Number.isNaN(Number(val))) return 'Price unlisted';
        const num = Number(val);
        return Number.isInteger(num) ? `$${num}` : `$${num.toFixed(2)}`;
      }

      function formatShipping(l) {
        if (l.shippingType === 'free') return { text: 'Free shipping', cls: 'ship-badge ship-free' };
        if (l.shippingType === 'known' && l.shippingPrice !== null) return { text: `+$${Number(l.shippingPrice).toFixed(2)} shipping`, cls: 'ship-badge' };
        if (l.shippingType === 'local_pickup') return { text: 'Local pickup', cls: 'ship-badge' };
        return { text: '+ shipping', cls: 'ship-badge' };
      }

      function formatRelativeTime(iso) {
        const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
        if (diffMin < 2) return 'Just now';
        if (diffMin < 60) return `${diffMin}m ago`;
        const hrs = Math.round(diffMin / 60);
        if (hrs < 24) return `${hrs}h ago`;
        return `${Math.round(hrs / 24)}d ago`;
      }

      // --- Interest-Triggered Status Tooltips (modern-web-guidance: interest-triggered-tooltips) ---
      const ownedHintTriggers = new WeakSet();
      const tipCloseTimers = new Map();

      function setupHintTooltips() {
        const supportsPopover = Object.hasOwn(HTMLElement.prototype, 'popover');
        if (supportsPopover) {
          const probe = document.createElement('div');
          probe.popover = 'hint';
          if (probe.popover !== 'hint') {
            document.addEventListener('beforetoggle', ({ target, newState }) => {
              const toggletip = target.getAttribute('popover') === 'hint'
                && document.querySelector(`[popovertarget="${CSS.escape(target.id)}"]`);
              if (newState === 'open' && toggletip) {
                target.popover = 'auto';
              }
            }, true);
          }
        }

        document.addEventListener('toggle', (e) => {
          const pop = e.target;
          if (!pop || !pop.id) return;
          const isOpen = e.newState === 'open';
          document.querySelectorAll(`[interestfor="${CSS.escape(pop.id)}"]`).forEach(trigger => {
            if (ownedHintTriggers.has(trigger)) {
              trigger.setAttribute('aria-expanded', String(isOpen));
            }
          });
          if (isOpen && pop.classList.contains('status-tooltip')) {
            const mpId = pop.id.replace('status-tip-', '');
            const card = document.querySelector(`[data-status-card="${CSS.escape(mpId)}"]`);
            if (card) {
              syncTooltipWidth(card, pop);
              if (!supportsAnchorPos()) positionTooltipFallback(card, pop);
            }
          }
        }, true);
      }

      function supportsAnchorPos() {
        return typeof CSS !== 'undefined' && typeof CSS.supports === 'function' && CSS.supports('position-area', 'block-end');
      }

      function supportsAnchorSize() {
        return typeof CSS !== 'undefined' && typeof CSS.supports === 'function' && CSS.supports('width', 'anchor-size(width)');
      }

      function syncTooltipWidth(card, tip) {
        if (!card || !tip || typeof card.getBoundingClientRect !== 'function') return;
        const cr = card.getBoundingClientRect();
        if (cr.width <= 0) return;
        const width = Math.min(cr.width, window.innerWidth - 16);
        if (!supportsAnchorPos() || !supportsAnchorSize()) {
          tip.style.width = `${width}px`;
          tip.style.maxWidth = `${width}px`;
        }
      }

      function positionTooltipFallback(card, tip) {
        if (!card || !tip || typeof card.getBoundingClientRect !== 'function') return;
        const cr = card.getBoundingClientRect();
        const width = cr.width > 0 ? Math.min(cr.width, window.innerWidth - 16) : Math.min(300, window.innerWidth - 16);
        const left = Math.max(8, Math.min(cr.left, window.innerWidth - width - 8));
        const spaceBelow = window.innerHeight - cr.bottom;
        tip.style.left = `${left}px`;
        tip.style.width = `${width}px`;
        tip.style.maxWidth = `${width}px`;
        if (spaceBelow < 110 && cr.top > 110) {
          tip.style.top = 'auto';
          tip.style.bottom = `${window.innerHeight - cr.top + 6}px`;
        } else {
          tip.style.bottom = 'auto';
          tip.style.top = `${cr.bottom + 6}px`;
        }
      }

      function syncHintTooltipAria(container) {
        for (const trigger of container.querySelectorAll('[interestfor]')) {
          const targetId = trigger.getAttribute('interestfor');
          const hint = targetId ? document.getElementById(targetId) : null;
          if (!hint || hint.getAttribute('popover') !== 'hint') continue;
          const hintText = hint.textContent.replace(/\s+/g, ' ').trim();
          const triggerLabel = (trigger.getAttribute('aria-label') || trigger.textContent || '').replace(/\s+/g, ' ').trim();
          if (hintText && hintText === triggerLabel) continue;
          if (!hint.hasAttribute('role')) hint.setAttribute('role', 'tooltip');
          const opensOnActivation = trigger.hasAttribute('popovertarget') || trigger.hasAttribute('commandfor');
          if (opensOnActivation) {
            if (!trigger.hasAttribute('aria-expanded')) {
              let open = false;
              try { open = hint.matches(':popover-open'); } catch { open = hint.classList.contains('tooltip-open'); }
              trigger.setAttribute('aria-expanded', String(open));
            }
            ownedHintTriggers.add(trigger);
          } else if (!trigger.hasAttribute('aria-describedby')) {
            trigger.setAttribute('aria-describedby', hint.id);
          }
        }
      }

      function openStatusTooltip(card, tip) {
        if (!tip) return;
        const prev = tipCloseTimers.get(tip.id);
        if (prev) {
          clearTimeout(prev);
          tipCloseTimers.delete(tip.id);
        }
        syncTooltipWidth(card, tip);
        if (Object.hasOwn(HTMLElement.prototype, 'popover') && typeof tip.showPopover === 'function') {
          try { tip.showPopover(); } catch { /* already open */ }
        } else {
          tip.classList.add('tooltip-open');
        }
        if (!supportsAnchorPos()) positionTooltipFallback(card, tip);
      }

      function scheduleCloseStatusTooltip(tip, hoverState) {
        if (!tip) return;
        const prev = tipCloseTimers.get(tip.id);
        if (prev) clearTimeout(prev);
        const timerId = window.setTimeout(() => {
          tipCloseTimers.delete(tip.id);
          if (hoverState.trigger || hoverState.tip) return;
          if (Object.hasOwn(HTMLElement.prototype, 'popover') && typeof tip.hidePopover === 'function') {
            try { tip.hidePopover(); } catch { /* already closed */ }
          } else {
            tip.classList.remove('tooltip-open');
          }
        }, 120);
        tipCloseTimers.set(tip.id, timerId);
      }

      function wireStatusTooltips() {
        const root = document.getElementById('app-root');
        if (!root) return;
        syncHintTooltipAria(root);
        for (const infoBtn of root.querySelectorAll('.status-info-btn')) {
          const tipId = infoBtn.getAttribute('interestfor');
          const tip = tipId ? document.getElementById(tipId) : null;
          const card = infoBtn.closest('[data-status-card]');
          if (!tip || !card) continue;
          const hoverState = { trigger: false, tip: false };
          infoBtn.addEventListener('pointerenter', () => {
            hoverState.trigger = true;
            openStatusTooltip(card, tip);
          });
          infoBtn.addEventListener('pointerleave', () => {
            hoverState.trigger = false;
            scheduleCloseStatusTooltip(tip, hoverState);
          });
          tip.addEventListener('pointerenter', () => {
            hoverState.tip = true;
            openStatusTooltip(card, tip);
          });
          tip.addEventListener('pointerleave', () => {
            hoverState.tip = false;
            scheduleCloseStatusTooltip(tip, hoverState);
          });
        }
      }

      // --- Persistent Toast Notifications (modern-web-guidance: persistent-toast-notifications) ---
      let toastTimer = null;
      let toastPaused = false;
      let lastPriorFocus = null;

      function announceSr(text) {
        if (typeof document.ariaNotify === 'function') {
          document.ariaNotify(text);
        } else {
          const live = document.getElementById('sr-live-region');
          if (live) live.textContent = text;
        }
      }

      function showToast(message, { undoAction = null } = {}) {
        // Do not surface background toasts while a modal dialog is open
        if (document.querySelector('dialog[open]')) return;
        const toast = document.getElementById('undo-toast');
        const msgEl = document.getElementById('undo-toast-msg');
        const actEl = document.getElementById('undo-toast-action');
        if (!toast || !msgEl || !actEl) return;

        lastPriorFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
        msgEl.textContent = message;
        if (undoAction) {
          actEl.hidden = false;
          actEl.onclick = () => {
            undoAction();
            hideToast();
          };
        } else {
          actEl.hidden = true;
          actEl.onclick = null;
        }

        if (Object.hasOwn(HTMLElement.prototype, 'popover')) {
          try { toast.showPopover(); } catch { /* already open */ }
        } else {
          toast.classList.add('toast-visible');
        }

        announceSr(undoAction ? `${message} Actions available` : message);
        scheduleToastDismiss();
      }

      function hideToast() {
        if (toastTimer) {
          clearTimeout(toastTimer);
          toastTimer = null;
        }
        const toast = document.getElementById('undo-toast');
        if (!toast) return;
        if (Object.hasOwn(HTMLElement.prototype, 'popover')) {
          try { toast.hidePopover(); } catch { /* already hidden */ }
        } else {
          toast.classList.remove('toast-visible');
        }
        if (lastPriorFocus && lastPriorFocus.isConnected) {
          lastPriorFocus.focus();
        }
      }

      function scheduleToastDismiss() {
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          const toast = document.getElementById('undo-toast');
          if (!toast) return;
          if (toastPaused || toast.contains(document.activeElement)) {
            scheduleToastDismiss();
            return;
          }
          hideToast();
        }, 7000);
      }

      function setupToastLifecycle() {
        const toast = document.getElementById('undo-toast');
        const closeBtn = document.getElementById('undo-toast-close');
        if (!toast) return;
        toast.addEventListener('pointerenter', () => { toastPaused = true; });
        toast.addEventListener('pointerleave', () => { toastPaused = false; scheduleToastDismiss(); });
        toast.addEventListener('focusin', () => { toastPaused = true; });
        toast.addEventListener('focusout', () => { toastPaused = false; scheduleToastDismiss(); });
        if (closeBtn && !Object.hasOwn(HTMLElement.prototype, 'popover')) {
          closeBtn.addEventListener('click', hideToast);
        }
      }

      // --- Native Modal Dialog Helpers (modern-web-guidance: dialog) ---
      let confirmHandler = null;
      let renameHandler = null;
      let saveNewHandler = null;

      function setupDialogs() {
        // Fallback light-dismiss for closedby="any" where unsupported
        if (!('closedBy' in HTMLDialogElement.prototype)) {
          const outside = (e, dialog) => {
            const r = dialog.getBoundingClientRect();
            return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
          };
          for (const dialog of document.querySelectorAll('dialog[closedby="any"]')) {
            let pressedOutside = false;
            dialog.addEventListener('pointerdown', (e) => { pressedOutside = outside(e, dialog); });
            dialog.addEventListener('pointerup', (e) => { if (pressedOutside && outside(e, dialog)) dialog.close(); });
          }
        }

        const cDlg = document.getElementById('confirm-dialog');
        cDlg.addEventListener('close', () => {
          const val = cDlg.returnValue;
          cDlg.returnValue = '';
          if (val === 'confirm' && confirmHandler) confirmHandler();
          confirmHandler = null;
        });

        const rDlg = document.getElementById('rename-dialog');
        rDlg.addEventListener('close', () => {
          const val = rDlg.returnValue;
          rDlg.returnValue = '';
          const input = document.getElementById('rename-dialog-input');
          if (val === 'confirm' && renameHandler && input.value.trim()) {
            renameHandler(input.value.trim());
          }
          renameHandler = null;
        });

        const sDlg = document.getElementById('save-new-dialog');
        sDlg.addEventListener('close', () => {
          const val = sDlg.returnValue;
          sDlg.returnValue = '';
          const input = document.getElementById('save-new-dialog-input');
          if (val === 'confirm' && saveNewHandler && input.value.trim()) {
            saveNewHandler(input.value.trim());
          }
          saveNewHandler = null;
        });
      }

      function openConfirmDialog({ title, body, submitLabel, onConfirm }) {
        const dlg = document.getElementById('confirm-dialog');
        document.getElementById('confirm-dialog-title').textContent = title;
        document.getElementById('confirm-dialog-body').textContent = body;
        document.getElementById('confirm-dialog-submit').textContent = submitLabel;
        confirmHandler = onConfirm;
        dlg.showModal();
      }

      function openRenameDialog(currentName, onSave) {
        const dlg = document.getElementById('rename-dialog');
        const input = document.getElementById('rename-dialog-input');
        input.value = currentName;
        renameHandler = onSave;
        dlg.showModal();

      }

      function openSaveNewDialog(onSave) {
        const dlg = document.getElementById('save-new-dialog');
        const input = document.getElementById('save-new-dialog-input');
        input.value = suggestSavedSearchName();
        saveNewHandler = onSave;
